[build]
  command = "npm run build --prefix frontend && npm install --prefix netlify/functions"
  publish = "frontend/dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[functions."major-gap-analysis"]
  timeout = 26

[functions."recommend-majors"]
  timeout = 26

[functions."major-roadmap"]
  timeout = 26

[functions."parse-pdf"]
  timeout = 20

[dev]
  command    = "npm run dev --prefix frontend"
  targetPort = 5173
  port       = 8888
  framework  = "#custom"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[plugins]]
  package = "@netlify/plugin-functions-install-core"